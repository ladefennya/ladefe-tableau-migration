name: LADEFE Tableau probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile scripts/*.py
          node --check demo/app.js

      - name: Download and inspect all Tableau workbooks
        run: |
          rm -rf output
          python scripts/tableau_probe.py --config config/all_workbooks.csv --out output --sample-rows 25

      - name: Analyze structural families and duplication
        run: python scripts/analyze_inventory.py --out output

      - name: Build canonical backend and census demo
        run: python scripts/build_canonical.py --out output --demo-out demo/data.json

      - name: Show summaries
        if: always()
        run: |
          cat output/SUMMARY.md || true
          cat output/SCALE_SUMMARY.md || true
          cat output/canonical/CANONICAL_SUMMARY.md || true

      - name: Publish latest inventory, canonical data and demo dataset
        if: success()
        run: |
          rm -rf results/latest data/canonical
          mkdir -p results/latest data/canonical
          for file in \
            SUMMARY.md SCALE_SUMMARY.md report.json \
            workbooks.csv worksheets.csv dashboards.csv fields.csv filters.csv \
            parameters.csv connections.csv relations.csv actions.csv \
            hyper_tables.csv hyper_columns.csv hyper_files.csv \
            workbook_signatures.csv families.csv \
            duplicate_extracts.csv duplicate_samples.csv
          do
            cp "output/$file" results/latest/
          done

          cp output/canonical/CANONICAL_SUMMARY.md results/latest/
          cp output/canonical/canonical_stats.csv results/latest/
          cp output/canonical/schema.json results/latest/
          cp output/canonical/*.csv.gz data/canonical/
          cp output/canonical/CANONICAL_SUMMARY.md data/canonical/
          cp output/canonical/canonical_stats.csv data/canonical/
          cp output/canonical/schema.json data/canonical/

          {
            echo "# Provenance"
            echo
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Generated at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo '- Full raw package: GitHub Actions artifact ladefe-tableau-probe'
          } > results/latest/PROVENANCE.md

          git config user.name "ladefe-tableau-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/latest data/canonical demo/data.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update canonical Tableau data and demo [skip ci]"
            git push
          fi

      - name: Upload full technical inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladefe-tableau-probe
          path: output/
          retention-days: 14
