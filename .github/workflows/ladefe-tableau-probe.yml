name: LADEFE Tableau probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and inspect Tableau workbooks
        run: python scripts/tableau_probe.py --config config/test_workbooks.csv --out output --sample-rows 25

      - name: Show summary
        if: always()
        run: cat output/SUMMARY.md || true

      - name: Upload technical inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ladefe-tableau-probe
          path: output/
          retention-days: 14
