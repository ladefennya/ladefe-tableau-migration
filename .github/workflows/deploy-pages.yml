name: Publish LADEFE replacement demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['LADEFE Tableau probe']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate semantic contract
        run: |
          node tests/semantics.test.js
          node tests/pilot_values.test.js
          node tests/view_relations.test.js
          node tests/map_utils.test.js
          node tests/navigation.test.js
          node --check demo/app.js
          node --check demo/semantics.js
          node --check demo/map-utils.js
          node --check demo/ui-utils.js
          python scripts/validate_demo.py

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
